name: rafeeq_alquran
description: "A Flutter Islamic companion app for Quran, adhkar, prayer times, reminders, and personal progress."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cloud_firestore: ^6.1.0
  cloud_functions: ^6.3.1
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  flutter_local_notifications: ^19.5.0
  flutter_riverpod: ^3.0.3
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.2
  go_router: ^17.0.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  riverpod_annotation: ^3.0.3
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  timezone: ^0.10.1

dev_dependencies:
  build_runner: 2.10.4
  drift_dev: ^2.29.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/adhan/
    - assets/data/adhkar/
    - assets/data/quran_samples/
    - assets/fonts/
    - assets/images/
